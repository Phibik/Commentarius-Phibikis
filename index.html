<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commentarius Phibikis — Jardín Digital</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/projecte.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand">Commentarius Phibikis</a>
            <nav class="nav-links">
                <a href="html/diarium.html">Diarium</a>
                <a href="html/projecta.html">Opera</a>
            </nav>
        </div>
    </header>

    <main class="project-container">
        
        <!-- SECCIÓN OPERA (Proyectos) -->
        <section id="opera" style="margin-bottom: 4rem;">
            <h1 class="project-title" style="font-size: 2rem; margin-bottom: 1.5rem;">Opera (Proyectos)</h1>
            <div id="projects-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
                <!-- Se inyecta dinámicamente -->
                <p style="color: var(--text-muted);">Cargando proyectos...</p>
            </div>
        </section>

        <!-- SECCIÓN DIARIUM (Logs) -->
        <section id="diarium" style="border-top: 1px solid var(--border-color); padding-top: 3rem;">
            <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Diarium (Bitácora de Campo)</h2>
            <div id="diarium-feed" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Se inyecta dinámicamente -->
                <p style="color: var(--text-muted);">Cargando registros...</p>
            </div>
        </section>

    </main>

    <footer class="footer">
        <p>Commentarius Phibikis &copy; 2026</p>
    </footer>

    <script type="module" src="js/inyectar-index-proyectos.js"></script>
    <script type="module" src="js/inyectar-index-logs.js"></script>
</body>
</html>
