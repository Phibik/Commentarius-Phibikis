<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Projecta Phibikis</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/projecta.css">
    <link rel="stylesheet" href="../css/tarjeta-proyecto.css">
    <link rel="stylesheet" href="../css/tarjeta-log.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="brand">Commentarius Phibikis</a>
            <nav class="nav-links">
                <a href="diarium.html">Diarium</a>
                <a href="projecta.html" class="active">Projecta</a>
            </nav>
        </div>
    </header>

    <main class="project-container">
        
        <div class="header-filters-wrapper">
            
            <div class="header-top-row">
                <div class="header-titles">
                    <h1 class="page-title">Projecta</h1>
                    <p class="page-subtitle">Catálogo de proyectos, publicaciones y borradores.</p>
                </div>

                <!-- Barra de Filtros Híbrida y Minimalista -->
                <div class="filters-group">
                    
                    <!-- ORDEN (Segmentado) -->
                    <div class="segmented-control">
                        <input type="radio" name="filtro-orden" id="ord-imp" value="importancia" checked>
                        <label for="ord-imp">Importancia</label>

                        <input type="radio" name="filtro-orden" id="ord-rec" value="recientes">
                        <label for="ord-rec">Recientes</label>
                    </div>

                    <!-- CLASE (Segmentado con colores) -->
                    <div class="segmented-control">
                        <input type="radio" name="filtro-clase" id="cla-todas" value="todos" checked>
                        <label for="cla-todas">Todas</label>

                        <input type="radio" name="filtro-clase" id="cla-opus" value="opus">
                        <label for="cla-opus" class="label-opus">Opus</label>

                        <input type="radio" name="filtro-clase" id="cla-adum" value="adumbratio">
                        <label for="cla-adum" class="label-adumbratio">Adumbratio</label>
                    </div>

                    <!-- FORMATO (Desplegable Dinámico) -->
                    <!-- El contenido se inyectará desde JS -->
                    <select id="filtro-formato" class="modern-select">
                        <option value="todos">Formato: Todos</option>
                    </select>

                    <!-- BOTÓN RESET -->
                    <button type="button" id="btn-reset-filtros" class="btn-reset" title="Restablecer filtros">
                        <!-- Icono SVG de recarga (Lucide Icons) -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                        </svg>
                    </button>
                </div>

            </div>

            <!-- Botones de Tags / Etiquetas (Pills) -->
            <div id="wrapper-tags" class="tags-filter-wrapper">
                <div id="contenedor-tags" class="tags-container">
                    <!-- Inyectado dinámicamente -->
                </div>
            </div>

        </div>

        <!-- Rejilla de Proyectos -->
        <div id="proyecta-grid" class="grid-proyectos">
            <p class="loading-text">Cargando catálogo de proyectos...</p>
        </div>

    </main>

    <footer class="footer">
        <p>Commentarius Phibikis &copy; 2026</p>
    </footer>

    <script type="module" src="../js/inyectar-index-proyectos.js"></script>
    <script type="module" src="../js/filtro-proyectos.js"></script>
</body>
</html>
