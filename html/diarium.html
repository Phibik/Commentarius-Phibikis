<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diarium Phibikis</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/tarjeta-log.css">
    <link rel="stylesheet" href="../css/diarium.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="brand">
                <img src="../images/Logo-Elegant_blanc_v0.1.png" alt="Logo Phibikis" class="brand-logo">
                <span>Commentarius Phibikis</span>
            </a>
            <nav class="nav-links">
                <a href="projecta.html">Projecta</a>
                <a href="diarium.html" class="active">Diarium</a>
                <a href="auctor.html">Auctor</a>
            </nav>
        </div>
    </header>

    <main class="diarium-container">
        
        <div class="header-filters-wrapper">
            
            <div class="header-top-row">
                <div class="header-titles">
                    <div class="title-counter-row">
                        <h1 class="page-title">Diarium</h1>
                        <span id="diarium-counter" class="diarium-counter"></span>
                    </div>
                    <p class="page-subtitle">Bitácora de campo, anotaciones y registro cronológico de actividad.</p>
                </div>

                <!-- Barra de Filtros idéntica a Projecta -->
                <div class="filters-group">
                    
                    <!-- ORDEN (Segmentado: Recientes / Antiguos) -->
                    <div class="segmented-control">
                        <input type="radio" name="filtro-orden-log" id="log-ord-rec" value="recientes" checked>
                        <label for="log-ord-rec">Recientes</label>

                        <input type="radio" name="filtro-orden-log" id="log-ord-ant" value="antiguos">
                        <label for="log-ord-ant">Antiguos</label>
                    </div>

                    <!-- PROYECTO (Desplegable Dinámico) -->
                    <select id="filtro-proyecto-log" class="modern-select" aria-label="Filtrar por proyecto">
                        <option value="todos">Proyecto: Todos</option>
                    </select>

                    <!-- BOTÓN RESET -->
                    <button type="button" id="btn-reset-logs" class="btn-reset" title="Restablecer filtros">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Buscador de palabras clave (en el espacio de las tags de Projecta) -->
            <div class="search-filter-wrapper">
                <div class="search-input-box">
                    <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </svg>
                    <input
                        type="search"
                        id="filtro-busqueda-log"
                        class="modern-search-input"
                        placeholder="Buscar por palabra clave..."
                        autocomplete="off"
                        aria-label="Buscar por palabra clave"
                    >
                </div>
            </div>

        </div>

        <!-- Feed de Registros -->
        <div id="diarium-full-feed" class="diarium-feed">
            <p class="diarium-status-msg">Cargando registros de la bitácora...</p>
        </div>

    </main>

    <footer class="footer">
        <p>Commentarius Phibikis &copy; 2026</p>
    </footer>

    <script type="module" src="../js/inyectar-index-logs.js"></script>
    <script type="module" src="../js/filtro-logs.js"></script>
</body>
</html>
