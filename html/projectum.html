<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Cargando... — Commentarius Phibikis</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/projecte.css">
</head>
<body>

    <!-- Navbar Fija -->
    <header class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="brand">Commentarius Phibikis</a>
            <nav class="nav-links">
                <a href="diarium.html">Diarium</a>
                <a href="projecta.html" class="active">Opera</a>
            </nav>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main id="project-container" class="project-container" style="padding-top: 2rem;">
        
        <!-- Cabecera del Proyecto -->
        <div class="sketch-header-top" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <a href="projecta.html" class="btn-icon" style="padding: 0.5rem 1rem; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 6px; text-decoration: none; color: var(--text-main); font-size: 0.9rem; display: inline-flex; align-items: center; gap: 0.4rem;">← Volver al índice</a>
            <div class="sketch-meta-info" style="font-family: var(--font-mono); font-size: 0.9rem; color: var(--text-muted);">
                <span id="proj-date-latest">----.--.--</span> &nbsp;|&nbsp; 
                <strong style="color: var(--text-main);" id="proj-version-latest">v-.--</strong>
            </div>
        </div>

        <!-- Título Principal -->
        <h1 id="proj-titulo-principal" class="project-title" style="font-size: 2.4rem; margin-bottom: 0.5rem;">
            Cargando proyecto...
        </h1>

        <!-- Barra de Acciones y Badges -->
        <div class="sketch-actions-bar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);">
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <span id="proj-type-badge" class="badge" style="background: var(--surface-color); border: 1px solid var(--border-color); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-family: var(--font-mono);">OPUS</span>
            </div>
            
            <div class="action-buttons-group" style="display: flex; gap: 0.8rem;">
                <a id="btn-ver-online" href="#" target="_blank" class="btn-icon" style="padding: 0.5rem 1rem; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 6px; text-decoration: none; color: var(--text-main); font-size: 0.9rem;">
                    Ver Online (PDF)
                </a>
                <a id="btn-download-pdf-latest" href="#" class="btn-icon" download style="padding: 0.5rem 1rem; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 6px; text-decoration: none; color: var(--text-main); font-size: 0.9rem;">
                    Descargar PDF
                </a>
                <button id="btn-copy-bibtex" class="btn-icon" style="padding: 0.5rem 1rem; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; color: var(--text-main); font-size: 0.9rem;">
                    BibTeX
                </button>
            </div>
        </div>

        <!-- NAVEGACIÓN DE PESTAÑAS -->
        <div class="tabs-nav" style="display: flex; gap: 1rem; border-bottom: 1px solid var(--border-color); margin-bottom: 2rem;">
            <button class="tab-btn active" data-tab="tab-bitacora" style="background: none; border: none; padding: 0.6rem 1rem; color: var(--text-main); font-family: var(--font-mono); cursor: pointer; border-bottom: 2px solid var(--text-main);">Bitácora</button>
            <button class="tab-btn" data-tab="tab-latex" style="background: none; border: none; padding: 0.6rem 1rem; color: var(--text-muted); font-family: var(--font-mono); cursor: pointer;">Visor PDF</button>
        </div>

        <!-- PESTAÑA 1: BITÁCORA COMPLETA (Se oculta al cambiar de pestaña) -->
        <div id="tab-bitacora" class="tab-content active">
            
            <!-- PANEL PRINCIPAL (Sinopsis/Desc/Figura + Versiones Lateral) -->
            <section id="bitacora-container" style="display: grid; grid-template-columns: 1fr 300px; gap: 2rem; margin-bottom: 3rem; align-items: start;">
                
                <!-- COLUMNA IZQUIERDA -->
                <div>
                    <!-- Sinopsis -->
                    <div style="margin-bottom: 1.5rem;">
                        <h3 style="font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase;">📝 Sinopsis</h3>
                        <p id="proj-sinopsis-text" style="color: var(--text-main); line-height: 1.6; margin: 0;"></p>
                    </div>

                    <!-- Descripción Ampliada (Opcional) -->
                    <div id="proj-descripcion-container" style="display: none; margin-bottom: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                        <h3 style="font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase;">📖 Descripción Técnica</h3>
                        <p id="proj-descripcion-text" style="color: var(--text-main); line-height: 1.6; margin: 0; font-size: 0.95rem;"></p>
                    </div>

                    <!-- Figura / Demostración (Opcional) -->
                    <div id="proj-figura-container" style="display: none; margin-bottom: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                        <h3 style="font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase;">🖼️ Demostración</h3>
                        <img id="proj-figura-img" alt="Demostración" style="width: 100%; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 0.4rem;">
                        <p id="proj-figura-caption" style="font-size: 0.8rem; color: var(--text-muted); font-family: var(--font-mono); margin: 0;"></p>
                    </div>
                </div>

                <!-- COLUMNA DERECHA (Versiones) -->
                <div style="background: var(--surface-color); border: 1px solid var(--border-color); padding: 1.2rem; border-radius: 8px;">
                    <h3 style="font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-muted); margin-bottom: 0.8rem; text-transform: uppercase; margin-top: 0;">📜 Versiones</h3>
                    <ul id="proj-versiones-list" style="list-style: none; padding: 0; margin: 0;">
                        <!-- Inyectado dinámicamente -->
                    </ul>
                </div>

            </section>

            <!-- LOGS DEL DIARIUM (Parte inferior de la Bitácora) -->
            <section style="border-top: 1px solid var(--border-color); padding-top: 2rem; margin-bottom: 3rem;">
                <h3 style="font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-muted); margin-bottom: 1rem; text-transform: uppercase;">📅 Bitácora de Campo (Diarium)</h3>
                <div id="proj-logs-list">
                    <!-- Inyectado como cajitas -->
                </div>
            </section>

        </div>

        <!-- PESTAÑA 2: VISOR DEDICADO (PDF / Vídeo YouTube) -->
        <div id="tab-latex" class="tab-content" style="display: none;">
            <div class="pdf-wrapper">
                <iframe id="proj-pdf-iframe" src="" width="100%" height="750px" style="border: none; background: #161920; border-radius: 8px; display: block;"></iframe>
            </div>
        </div>

    </main>

    <footer class="footer">
        <p>Commentarius Phibikis &copy; 2026</p>
    </footer>

    <script type="module" src="../js/inyectar-proyecto.js"></script>
</body>
</html>
