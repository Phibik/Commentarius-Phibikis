<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="page-title">Projectum Phibikis</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/tarjeta-proyecto.css">
    <link rel="stylesheet" href="../css/tarjeta-log.css">
    <link rel="stylesheet" href="../css/projectum.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="brand">Commentarius Phibikis</a>
            <nav class="nav-links">
                <a href="projecta.html">Projecta</a>
                <a href="diarium.html">Diarium</a>
                <a href="auctor.html">Auctor</a>
            </nav>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main id="project-container" class="project-container">
        
        <!-- Cabecera del Proyecto -->
        <div class="sketch-header-top">
            <a href="projecta.html" class="btn-icon">← Volver al Catálogo</a>
            <div class="sketch-meta-info">
                <span id="proj-version-latest" class="version-highlight">v-.--</span>
            </div>
        </div>

        <!-- Título Principal -->
        <h1 id="proj-titulo-principal" class="project-title-main">
            Cargando proyecto...
        </h1>

        <!-- Barra de Acciones, Badge y Etiquetas -->
        <div class="sketch-actions-bar">
            <div class="badge-group">
                <span id="proj-type-badge" class="badge">OPUS</span>
                <div id="proj-tags-list" class="project-tags"></div>
            </div>
            
            <div class="action-buttons-group">
                <!-- 1. Acción Principal -->
                <a id="btn-action-primary" href="#" class="btn-action btn-primary hidden">
                    Descargar PDF
                </a>

                <!-- 2. Acción Secundaria (PDF / GitHub) -->
                <a id="btn-action-secondary" href="#" target="_blank" rel="noopener noreferrer" class="btn-action btn-secondary hidden">
                    Ver PDF
                </a>

                <!-- 3. Acción Terciaria: Desplegable Citar -->
                <div id="cite-dropdown" class="cite-dropdown">
                    <button id="btn-cite-toggle" type="button" class="btn-action btn-tertiary" aria-haspopup="true" aria-expanded="false">
                        <span class="cite-btn-label">Citar</span>
                        <svg class="cite-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>

                    <div id="cite-menu" class="cite-menu" role="menu">
                        <div class="cite-menu-header">Copiar referencia</div>
                        <button type="button" class="cite-option" data-format="bibtex" role="menuitem">
                            <span class="cite-option-name">BibTeX</span>
                            <span class="cite-option-status">@misc</span>
                        </button>
                        <button type="button" class="cite-option" data-format="apa" role="menuitem">
                            <span class="cite-option-name">APA 7</span>
                            <span class="cite-option-status">Copiar</span>
                        </button>
                        <button type="button" class="cite-option" data-format="ieee" role="menuitem">
                            <span class="cite-option-name">IEEE</span>
                            <span class="cite-option-status">Copiar</span>
                        </button>
                        <button type="button" class="cite-option" data-format="mla" role="menuitem">
                            <span class="cite-option-name">MLA</span>
                            <span class="cite-option-status">Copiar</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- NAVEGACIÓN DE PESTAÑAS -->
        <div class="tabs-nav">
            <button class="tab-btn active" data-tab="tab-bitacora">Bitácora</button>
            <button class="tab-btn" data-tab="tab-latex">Visor PDF</button>
        </div>

        <!-- PESTAÑA 1: BITÁCORA COMPLETA -->
        <div id="tab-bitacora" class="tab-content active">
            
            <!-- PANEL PRINCIPAL (Sinopsis/Desc/Figura + Versiones Lateral) -->
            <section id="bitacora-container" class="bitacora-grid">
                
                <!-- COLUMNA IZQUIERDA -->
                <div class="bitacora-col-main">
                    <!-- Sinopsis -->
                    <div class="content-block">
                        <h3 class="section-subtitle">📝 Sinopsis</h3>
                        <p id="proj-sinopsis-text" class="text-block"></p>
                    </div>

                    <!-- Descripción Ampliada (Opcional) -->
                    <div id="proj-descripcion-container" class="content-block border-top hidden">
                        <h3 class="section-subtitle">📖 Descripción Técnica</h3>
                        <p id="proj-descripcion-text" class="text-block text-extended"></p>
                    </div>

                    <!-- Figura / Demostración (Opcional) -->
                    <div id="proj-figura-container" class="content-block border-top hidden">
                        <h3 class="section-subtitle">🖼️ Demostración</h3>
                        <img id="proj-figura-img" alt="Demostración" class="demo-image">
                        <p id="proj-figura-caption" class="demo-caption"></p>
                    </div>
                </div>

                <!-- COLUMNA DERECHA (Versiones) -->
                <aside class="sidebar-box">
                    <h3 class="section-subtitle no-margin-top">📜 Versiones</h3>
                    <ul id="proj-versiones-list" class="versions-list">
                        <!-- Inyectado dinámicamente -->
                    </ul>
                </aside>

            </section>

            <!-- LOGS DEL DIARIUM -->
            <section class="logs-section">
                <h3 class="section-subtitle">📅 Bitácora de Campo (Diarium)</h3>
                <div id="proj-logs-list" class="logs-grid">
                    <!-- Inyectado como cajitas -->
                </div>
            </section>

        </div>

        <!-- PESTAÑA 2: VISOR DEDICADO (PDF / Vídeo YouTube) -->
        <div id="tab-latex" class="tab-content">
            <div class="pdf-wrapper">
                <iframe id="proj-pdf-iframe" src="" class="pdf-iframe"></iframe>
            </div>
        </div>

    </main>

    <footer class="footer">
        <p>Commentarius Phibikis &copy; 2026</p>
    </footer>

    <script type="module" src="../js/inyectar-proyecto.js"></script>
</body>
</html>
