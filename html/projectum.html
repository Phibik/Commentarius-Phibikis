<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="page-title">Projectum Phibikis</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/tarjeta-proyecto.css">
    <link rel="stylesheet" href="../css/tarjeta-log.css">
    <link rel="stylesheet" href="../css/projectum.css">
</head>
<body>

    <!-- Navbar Fija -->
    <header class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="brand">Commentarius Phibikis</a>
            <nav class="nav-links">
                <a href="diarium.html">Diarium</a>
                <a href="projecta.html" class="active">Projecta</a>
            </nav>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main id="project-container" class="project-container">
        
        <!-- Cabecera del Proyecto -->
        <div class="sketch-header-top">
            <a href="projecta.html" class="btn-icon">← Volver al índice</a>
            <div class="sketch-meta-info">
                <span id="proj-date-latest">----.--.--</span> <span class="separator">|</span> 
                <strong id="proj-version-latest" class="version-highlight">v-.--</strong>
            </div>
        </div>

        <!-- Título Principal -->
        <h1 id="proj-titulo-principal" class="project-title-main">
            Cargando proyecto...
        </h1>

        <!-- Barra de Acciones y Badges -->
        <div class="sketch-actions-bar">
            <div class="badge-group">
                <span id="proj-type-badge" class="badge">OPUS</span>
            </div>
            
            <div class="action-buttons-group">
                <a id="btn-ver-online" href="#" target="_blank" class="btn-icon">
                    Ver Online (PDF)
                </a>
                <a id="btn-download-pdf-latest" href="#" class="btn-icon" download>
                    Descargar PDF
                </a>
                <button id="btn-copy-bibtex" class="btn-icon">
                    BibTeX
                </button>
            </div>
        </div>

        <!-- NAVEGACIÓN DE PESTAÑAS -->
        <div class="tabs-nav">
            <button class="tab-btn active" data-tab="tab-bitacora">Bitácora</button>
            <button class="tab-btn hidden" data-tab="tab-latex">Visor PDF</button>
        </div>

        <!-- PESTAÑA 1: BITÁCORA COMPLETA (Se oculta al cambiar de pestaña) -->
        <div id="tab-bitacora" class="tab-content active">
            
            <!-- PANEL PRINCIPAL (Sinopsis/Desc/Figura + Versiones Lateral) -->
            <section id="bitacora-container" class="bitacora-grid">
                
                <!-- COLUMNA IZQUIERDA -->
                <div class="bitacora-col-main">
                    <!-- Sinopsis -->
                    <div class="content-block">
                        <h3 class="section-subtitle">📝 Sinopsis</h3>
                        <p id="proj-sinopsis-text" class="text-block"></p>
                    </div>

                    <!-- Descripción Ampliada (Opcional) -->
                    <div id="proj-descripcion-container" class="content-block border-top hidden">
                        <h3 class="section-subtitle">📖 Descripción Técnica</h3>
                        <p id="proj-descripcion-text" class="text-block text-extended"></p>
                    </div>

                    <!-- Figura / Demostración (Opcional) -->
                    <div id="proj-figura-container" class="content-block border-top hidden">
                        <h3 class="section-subtitle">🖼️ Demostración</h3>
                        <img id="proj-figura-img" alt="Demostración" class="demo-image">
                        <p id="proj-figura-caption" class="demo-caption"></p>
                    </div>
                </div>

                <!-- COLUMNA DERECHA (Versiones) -->
                <aside class="sidebar-box">
                    <h3 class="section-subtitle no-margin-top">📜 Versiones</h3>
                    <ul id="proj-versiones-list" class="versions-list">
                        <!-- Inyectado dinámicamente -->
                    </ul>
                </aside>

            </section>

            <!-- LOGS DEL DIARIUM (Parte inferior de la Bitácora) -->
            <section class="logs-section">
                <h3 class="section-subtitle">📅 Bitácora de Campo (Diarium)</h3>
                <div id="proj-logs-list" class="logs-grid">
                    <!-- Inyectado como cajitas -->
                </div>
            </section>

        </div>

        <!-- PESTAÑA 2: VISOR DEDICADO (PDF / Vídeo YouTube) -->
        <div id="tab-latex" class="tab-content hidden">
            <div class="pdf-wrapper">
                <iframe id="proj-pdf-iframe" src="" class="pdf-iframe"></iframe>
            </div>
        </div>

    </main>

    <footer class="footer">
        <p>Commentarius Phibikis &copy; 2026</p>
    </footer>

    <script type="module" src="../js/inyectar-proyecto.js"></script>
</body>
</html>
